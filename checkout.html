<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Disc of the Dead — Cart</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter&family=Cinzel&family=JetBrains+Mono&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

<main class="product-page">
  <div class="product-wrapper checkout-layout">

    <div class="checkout-left">

      <div class="product-meta">
        <h1>CHECKOUT</h1>

        <div id="cartItems"></div>

        <div class="checkout-block">

          <span class="section-label">SHIPPING DETAILS</span>

          <div class="checkout-fields">
            <input type="text" placeholder="Full Name" required />
            <input type="text" placeholder="Street Address" required />
            <input type="text" placeholder="City" required />

            <div class="split">
              <input type="text" placeholder="ZIP Code" required />
              <input type="text" placeholder="Country" required />
            </div>
          </div>

        </div>

        <div class="checkout-form">
          <input type="text" placeholder="Cardholder Name">
          <input type="text" placeholder="Card Number">
          <input type="text" placeholder="Expiry Date">
          <input type="text" placeholder="Security Code">
        </div>

        <div class="product-actions">
          <button onclick="completeOrder()" class="load">
            COMPLETE PURCHASE
          </button>
        </div>

      </div>

    </div>

    <div class="checkout-right">

      <div class="checkout-summary">
        <div class="product-price" id="cartTotal">
          TOTAL — £0.00
        </div>
      </div>

      
    </div>

  </div>
</main>
